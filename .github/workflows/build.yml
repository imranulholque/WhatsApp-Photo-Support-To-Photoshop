name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish WhatsAppPS.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: WhatsAppPS
          path: out/WhatsAppPS.exe
